name: Offline regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://volunteer-test.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-anon-key
      - run: npx --no-install playwright install --with-deps chromium
      - run: docker pull postgres:17-alpine
      - run: npm test
