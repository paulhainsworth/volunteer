<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        }
      } catch {
        // Keep the default when browser storage is unavailable.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berkeley Omnium Volunteer Hub</title>
    <meta name="description" content="Find a volunteer shift at the Berkeley Omnium and help raise funds for East Bay high school mountain bike teams." />
    <meta property="og:title" content="Berkeley Omnium Volunteer Hub" />
    <meta property="og:site_name" content="Berkeley Omnium Volunteer Hub" />
    <meta property="og:description" content="Find a volunteer shift at the Berkeley Omnium and help raise funds for East Bay high school mountain bike teams." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Berkeley Omnium Volunteer Hub" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/$/, '') || '/';
          if (p === '/kids' && (!location.hash || location.hash === '#')) {
            history.replaceState(null, '', '/#/kids');
          }
          if (p === '/contacts' && (!location.hash || location.hash === '#')) {
            var contactsEnd = new Date('2026-04-19T23:59:59.999-07:00').getTime();
            if (Date.now() <= contactsEnd) {
              history.replaceState(null, '', '/#/contacts');
            } else {
              history.replaceState(null, '', '/#/');
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
